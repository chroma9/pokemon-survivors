name: Freeze private migration replay compatibility

on:
  push:
    branches: [Updated-11-3-2026]
    paths:
      - 'src/game/rulesGuard.test.ts'
      - 'server/scripts/freeze-rules.mjs'
      - '.github/workflows/freeze-private-replay.yml'

permissions:
  contents: write

concurrency:
  group: freeze-private-replay
  cancel-in-progress: false

jobs:
  freeze:
    if: github.repository == 'chroma9/pokemon-survivors'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install game and verifier tooling
        run: |
          npm ci
          npm ci --prefix server
      - name: Freeze actual production rules 43
        env:
          RULES_FREEZE_COMMIT: 5a98c16f2ad7b660545b760330d6d5611b12d3aa
        run: |
          git fetch origin main
          npm run rules:freeze
      - name: Commit frozen verifier only to migration branch
        run: |
          git add server/sims
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Freeze previous production rules 43 for private migration"
            git push origin HEAD:Updated-11-3-2026
          fi
